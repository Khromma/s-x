<!DOCTYPE html>
<html lang="en">
  <head>
    <title>S-Searchex Link Manager</title>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search)
      const linkParam = params.get('link')
      if (linkParam) {
        window.location.href = linkParam
      }
    </script>
  </body>
</html>
