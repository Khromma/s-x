<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Translator</title>
  <style>
    #hostLang { 
      width: 200px;
    }
  </style>
</head>
<body>

<select id="hostLang"></select>

<h1>Hello world</h1>
<h2>This must NOT translate</h2>
<h3>Welcome to my website</h3>
<h4>This must NOT translate</h4>
<h1 class="untranslatable">Untranslatable H1</h1>

<script>
const languages = {
    "en": "English",
    "es": "Español",
    "fr": "Français",
    "de": "Deutsch",
    "it": "Italiano",
    "pt": "Português",
    "ja": "日本語",
    "ko": "한국어",
    "zh-CN": "中文 (简体)",
    "zh-TW": "中文 (繁體)",
    "ar": "العربية",
    "hi": "हिन्दी",
    "ru": "Русский"
};

const translationConfig = [
    { tag: "h1", translate: true },
    { tag: "h2", translate: false },
    { tag: "h3", translate: true },
    { tag: "h4", translate: false },
    { tag: ".untranslatable", translate: false }
];

const hostLang = document.getElementById("hostLang");
const originalText = new Map();

function populateDropdowns() {
    Object.entries(languages).forEach(([code, name]) => {
        const opt1 = new Option(name, code);
        hostLang.add(opt1);
    });
    hostLang.value = 'en';
}

async function translatePage(lang) {
    if (lang === "en") {
        originalText.forEach((text, el) => {
            el.nodeValue = text;
        });
        return;
    }

    const textNodesToTranslate = [];
    const activeTags = translationConfig.filter(r => r.translate).map(r => r.tag).join(",");
    const excludedTags = translationConfig.filter(r => !r.translate).map(r => r.tag).join(",");

    if (!activeTags) return;

    document.querySelectorAll(activeTags).forEach(parentEl => {
        if (excludedTags && parentEl.matches(excludedTags)) return;

        function walk(node) {
            if (node.nodeType === Node.ELEMENT_NODE && excludedTags && node.matches(excludedTags)) {
                return;
            }
            if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim() !== "") {
                if (!originalText.has(node)) originalText.set(node, node.nodeValue);
                textNodesToTranslate.push(node);
            }
            for (let child = node.firstChild; child; child = child.nextSibling) {
                walk(child);
            }
        }
        walk(parentEl);
    });

    await Promise.all(textNodesToTranslate.map(async node => {
        const text = originalText.get(node);
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(lang)}&dt=t&q=${encodeURIComponent(text)}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            let translatedText = data[0].map(x => x[0]).join("");
            if (translatedText.length > 0) {
                translatedText = translatedText.charAt(0).toUpperCase() + translatedText.slice(1);
            }
            
            node.nodeValue = translatedText;
        } catch (error) {
            console.error("Translation error:", error);
        }
    }));
}

populateDropdowns();
hostLang.addEventListener("change", () => translatePage(hostLang.value));
</script>
</body>
</html>
