<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maps</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html, body,#map{
  width:100%;
  height:100%;
  margin:0
}
body{
  font-family:Arial,sans-serif;
  overflow:hidden
}
#map {
  position:absolute;
  inset:0
}

.search-wrap{
position:absolute;
top:14px;
left:14px;
right:14px;
z-index:1000;
display:flex;
gap:8px;
max-width:700px;
margin:auto
}

.search-box{
height:54px;
flex:1;
display:flex;
align-items:center;
background:white;
border-radius:28px;
box-shadow:0 2px 12px #0003;
padding:0 18px
}

.search-icon{
font-size:21px;
margin-right:10px
}

#search{
border:0;
outline:0;
width:100%;
font-size:16px;
background:transparent
}

.circle-btn{
width:54px;
height:54px;
border:0;
border-radius:50%;
background:white;
box-shadow:0 2px 12px #0003;
font-size:23px;
cursor:pointer
}

.circle-btn:active{
transform:scale(.94)
}

.bottom-card{
position:absolute;
left:14px;
right:14px;
bottom:14px;
z-index:1000;
max-width:700px;
margin:auto;
background:white;
border-radius:20px;
padding:15px 18px;
box-shadow:0 3px 16px #0003
}

.title{
font-size:16px;
font-weight:bold;
margin-bottom:5px
}

.subtitle{
font-size:13px;
color:#666
}

.clear{
float:right;
border:0;
background:#f1f3f4;
border-radius:20px;
padding:8px 13px;
cursor:pointer
}

.leaflet-control-zoom{
border:0!important;
box-shadow:0 2px 10px #0003!important
}

.leaflet-control-zoom a{
border:0!important
}

@media(max-width:600px){
.search-wrap{
top:10px;
left:10px;
right:10px
}

.bottom-card{
left:10px;
right:10px;
bottom:10px
}
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search-wrap">
<div class="search-box">
<span class="search-icon">⌕</span>
<input id="search" placeholder="Search Google Maps-style..." autocomplete="off">
</div>

<button class="circle-btn" id="locationBtn">⌖</button>
</div>

<div class="bottom-card">
<button class="clear" id="clearBtn">Clear</button>
<div class="title" id="title">Maps</div>
<div class="subtitle" id="subtitle">
Search for a place or tap the map to drop a pin.
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map=L.map("map",{zoomControl:true}).setView([4.711,-74.072],6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}).addTo(map);

const search=document.getElementById("search");
const locationBtn=document.getElementById("locationBtn");
const clearBtn=document.getElementById("clearBtn");
const title=document.getElementById("title");
const subtitle=document.getElementById("subtitle");

let markers=[];

function escapeHTML(text){
return String(text).replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char]));
}

function addMarker(lat,lng,name="Pinned location"){
const marker=L.marker([lat,lng]).addTo(map);

marker.bindPopup(
"<b>"+escapeHTML(name)+"</b><br>"+
lat.toFixed(5)+", "+lng.toFixed(5)
).openPopup();

markers.push(marker);

title.textContent=name;
subtitle.textContent=
lat.toFixed(5)+", "+lng.toFixed(5);
}

async function searchPlace(){
const query=search.value.trim();

if(!query)return;

title.textContent="Searching...";
subtitle.textContent=query;

try{
const response=await fetch(
"https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+
encodeURIComponent(query)
);

const results=await response.json();

if(!results.length){
title.textContent="Place not found";
subtitle.textContent="Try another search.";
return;
}

const place=results[0];
const lat=parseFloat(place.lat);
const lng=parseFloat(place.lon);

map.setView([lat,lng],16);

addMarker(lat,lng,place.display_name);

}catch(error){
title.textContent="Search unavailable";
subtitle.textContent="Check your internet connection.";
}
}

search.addEventListener("keydown",event=>{
if(event.key==="Enter"){
searchPlace();
}
});

map.on("click",event=>{
addMarker(
event.latlng.lat,
event.latlng.lng,
"Pinned location"
);
});

locationBtn.addEventListener("click",()=>{
if(!navigator.geolocation){
title.textContent="Location unavailable";
subtitle.textContent="Your browser does not support location.";
return;
}

title.textContent="Finding your location...";
subtitle.textContent="Please allow location access.";

navigator.geolocation.getCurrentPosition(
position=>{
const lat=position.coords.latitude;
const lng=position.coords.longitude;

map.setView([lat,lng],17);

addMarker(lat,lng,"Your location");
},
()=>{
title.textContent="Location unavailable";
subtitle.textContent="Location permission was denied.";
},
{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
}
);
});

clearBtn.addEventListener("click",()=>{
markers.forEach(marker=>{
map.removeLayer(marker);
});

markers=[];

title.textContent="Maps";
subtitle.textContent=
"Search for a place or tap the map to drop a pin.";
});
</script>

</body>
</html>
