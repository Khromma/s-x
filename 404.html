<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="s-x/s-x-logo.png">
    <title>Page not found - S-X A new universe</title>
    <style>
        :root {
            --sxpr: #ff005f;
            --sxib: #4444ff;
            --sxgy: #ffbb00;
            --sxcg: #00ff66;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #000000;
        }

        html, body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 0 12px;
            overflow-x: hidden;
        }

        .color-text-container {
            width: 100%;
            margin-top: 84px;
            margin-bottom: 12px;
            background: transparent;
            box-sizing: border-box;
            display: flex;
            gap: 2px;
            flex-direction: row;            
            align-items: center;
            justify-content: center;
         }
      
         .color-text, .exc-sign {
             font-size: 80px;
             font-weight: bold;
         }

         .exc-sign {
             color: #000000 !important;
         }
      
         .color-text:nth-child(4n+1 of .color-text) {
             color: var(--sxpr);
         }

        .color-text:nth-child(4n+2 of .color-text) {
            color: var(--sxib);
        }

        .color-text:nth-child(4n+3 of .color-text) {
            color: var(--sxgy);
        }

        .color-text:nth-child(4n+4 of .color-text) {
            color: var(--sxcg);
        }

        .info-text {
            font-size: 16px;
            color: #000000 !important;
        }

    </style>    
    </head>
    <body>
        <div class="color-text-container">
            <p class="color-text" id="colorText">OOPS</p>
            <p class="exc-sign">!</p>
        </div>
        <p class="info-text">The requested URL was not found, it might be temporally or it might have moved.</p>
        <script>
            function toggleFontColor() {
                colorText.innerHTML = colorText.textContent.split('').map(l => l === ' ' ? ' ' : `<span class="color-text">${l}</span>`).join('');
            }

            toggleFontColor();
        </script>
    </body>
</html>
