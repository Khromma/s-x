<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="s-mapex-logo-map.png?v=1">
    <title>S-Mapex</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --sxpr: #ff005f;
            --sxib: #4444ff;
            --sxgy: #ffbb00;
            --sxcg: #00ff66;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #000000;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .sticky-header {
            position: absolute;
            top: 12px;
            left: 16px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .sticky-header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #000000 !important;
        }

        .search-overlay {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: calc(100% - 32px);
            max-width: 500px;
        }

        .search-pill {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #d1d5db;
            border-radius: 50px;
            padding: 4px 6px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        }

        .pill-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: 
                radial-gradient(circle at top left, var(--sxpr) 0%, transparent 70%),
                radial-gradient(circle at top right, var(--sxib) 0%, transparent 70%),
                radial-gradient(circle at bottom left, var(--sxgy) 0%, transparent 70%),
                radial-gradient(circle at bottom right, var(--sxcg) 0%, transparent 70%) !important;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .pill-btn:hover {
            transform: scale(1.05);
            opacity: 0.95;
        }

        .pill-btn:active {
            transform: scale(0.95);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            display: block;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 0 12px;
            font-size: 16px;
            font-weight: 500;
            background: transparent;
            color: #000000;
        }

        .search-input::placeholder {
            color: #4b5563;
        }

        .floating-widget {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 1000;
            width: 320px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border: 1px solid #cbd5e1;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .widget-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .coords-text {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.2px;
        }

        .location-text {
            font-size: 15px;
            font-weight: 600;
            color: #475569;
            line-height: 1.3;
        }

        .small-action-btn {
            background: 
                radial-gradient(circle at top left, var(--sxpr) 0%, transparent 70%),
                radial-gradient(circle at top right, var(--sxib) 0%, transparent 70%),
                radial-gradient(circle at bottom left, var(--sxgy) 0%, transparent 70%),
                radial-gradient(circle at bottom right, var(--sxcg) 0%, transparent 70%) !important;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .small-action-btn:hover {
            transform: scale(1.08);
            opacity: 0.95;
        }

        .widget-divider {
            width: 100%;
            height: 1px;
            background: #e2e8f0;
            margin: 2px 0;
        }

        .lang-label {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
        }

        #hostLang {
            padding: 6px 10px;
            border-radius: 20px;
            outline: none;
            font-weight: 600;
            cursor: pointer;
            background-color: #ffffff !important;
            border: 1.5px solid #94a3b8 !important;
            color: #000000 !important;
            height: 34px !important;
            width: 130px !important;
            font-size: 12px !important;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .leaflet-top.leaflet-left {
            top: 70px !important;
            left: 16px !important;
        }

        @media (max-width: 640px) {
            .sticky-header {
                display: none;
            }

            .search-overlay {
                top: 12px;
                width: calc(100% - 24px);
            }

            .floating-widget {
                left: 0;
                bottom: 0;
                width: 100vw;
                border-radius: 20px 20px 0 0;
                border-left: none;
                border-right: none;
                border-bottom: none;
                padding: 18px 20px 24px 20px;
                box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.15);
            }

            .leaflet-top.leaflet-left {
                top: 70px !important;
                left: 12px !important;
            }
        }
    </style>
</head>
<body>

    <header class="sticky-header">
        <img class="logo" src="s-mapex-logo-map.png" alt="S-Mapex Logo">
        <h1>S-Mapex</h1>
    </header>

    <div class="search-overlay">
        <div class="search-pill">
            <button class="pill-btn" id="searchBtn>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="btn-icon">
                    <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 21L16.65 16.65" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <input type="text" id="searchInput" class="search-input" placeholder="Search...">
            <button class="pill-btn" id="clearBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="btn-icon">
                    <path d="M18 6L6 18M6 6L18 18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="map"></div>

    <div class="floating-widget">
        <div class="widget-row">
            <span class="coords-text untranslatable" id="coordsDisplay">4.6097, -74.0817</span>
            <button class="small-action-btn" id="speakCoordsBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" class="btn-icon" style="width:20px;height:20px;">
                    <path fill="#ffffff" d="M120 244H175L244 175V394L175 325H120Z"/>
                    <path fill="#ffffff" d="M147 271H186L216 241V328L186 298H147Z"/>
                    <path fill="#ffffff" d="M271 165C328 178 367 222 367 284C367 346 328 390 271 403V374C311 363 339 331 339 284C339 237 311 205 271 194Z"/>
                    <path fill="#ffffff" d="M271 213C294 222 306 249 306 284C306 319 294 346 271 355Z"/>
                </svg>
            </button>
        </div>

        <div class="widget-row">
            <span class="location-text" id="locationDisplay">Located on Bogotá, Colombia</span>
            <button class="small-action-btn" id="copyLocationBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="btn-icon" style="width:18px;height:18px;">
                    <path d="M8 7V5C8 3.9 8.9 3 10 3H19C20.1 3 21 3.9 21 5V14C21 15.1 20.1 16 19 16H17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="3" y="7" width="14" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
                </svg>
            </button>
        </div>

        <div class="widget-divider"></div>

        <div class="widget-row">
            <span class="lang-label lang-text">Language</span>
            <select id="hostLang"></select>
        </div>
    </div>

    <script>
        const hostLanguages = {
            "ab": "Аԥсшәа",
            "ace": "Aceh",
            "ach": "Acoli",
            "om": "Afaan Oromoo",
            "af": "Afrikaans",
            "alz": "Alur",
            "am": "አማርኛ",
            "ar": "العربية",
            "as": "অসমীয়া",
            "ig": "Asụsụ Igbo",
            "gn": "Avañe'ẽ",
            "awa": "अवधी",
            "ay": "Aymar aru",
            "az": "Azərbaycanca",
            "ban": "Balines",
            "bm": "Bamanankan",
            "ms": "Bahasa Melayu",
            "id": "Bahasa Indonesia",
            "ba": "Башҡортса",
            "min": "Baso Minangkabau",
            "mad": "Basa Madura",
            "jw": "Basa Jawa",
            "su": "Basa Sunda",
            "bbc": "Batak Toba",
            "bts": "Batak Simalungun",
            "btx": "Batak Karo",
            "be": "Беларуская",
            "bew": "Betawi", "bho": "भोजपुरी", "bik": "Bikol", "bo": "བོད་སྐད་", "bs": "Bosanski",
            "br": "Brezhoneg", "bg": "Български", "bua": "Буряад", "ca": "Català", "ceb": "Cebuano",
            "ny": "Chichewa", "nyan": "Chinyanja", "sn": "ChiShona", "co": "Corsu", "cy": "Cymraeg",
            "da": "Dansk", "zap": "Diidxazá", "doi": "डोगri", "de": "Deutsch", "dz": "རྫོང་ཁ",
            "et": "Eesti", "en": "English", "es": "Español", "eo": "Esperanto", "eu": "Euskara",
            "ee": "Eʋegbe", "fj": "Na Vosa Vakaviti", "fil": "Filipino", "fr": "Français", "fy": "Frysk",
            "ga": "Gaeilge", "gd": "Gàidhlig", "gl": "Galego", "lg": "Luganda", "lua": "Ciluba",
            "kl": "Kalaallisut", "gu": "ગુજરાતી", "ht": "Kreyòl Ayisyen", "ha": "Harshen Hausa",
            "haw": "ʻŌlelo Hawaiʻi", "he": "עברית", "hi": "हिन्दी", "hmn": "Hmoob", "hr": "Hrvatski",
            "hu": "Magyar", "hy": "Հայերեն", "is": "Íslenska", "ilo": "Ilocano", "iu": "Inuktitut",
            "it": "Italiano", "ja": "日本語", "kn": "ಕನ್ನಡ", "kk": "Қазақ тілі", "km": "ភាសាខ្មែរ",
            "rw": "Kinyarwanda", "ky": "Кыргызча", "kg": "Kikongo", "kok": "கொங்கணி", "ko": "한국어",
            "kri": "Krio", "ckb": "سۆرانی", "ku": "Kurdî", "la": "Latina", "lb": "Lëtzebuergesch",
            "lo": "ພາສາລາວ", "lt": "Lietuvių", "luo": "Dholuo", "lv": "Latviešu", "mg": "Malagasy",
            "mk": "Македонски", "ml": "മലയാളം", "mr": "मराठी", "mi": "Te Reo Māori", "mn": "Монгол",
            "mt": "Malti", "my": "မြန်မာစာ", "ne": "नेपाली", "nl": "Nederlands", "no": "Norsk",
            "or": "ଓଡ଼ିଆ", "pa": "ਪੰਜਾਬੀ", "pl": "Polski", "ps": "پښتو", "pt": "Português",
            "qu": "Runa Simi", "ro": "Română", "ru": "Русский", "sa": "संस्कृतम्", "sd": "سنڌي",
            "si": "සිංහල", "sk": "Slovenčina", "sl": "Slovenščina", "so": "Soomaali", "sq": "Shqip",
            "sr": "Српски", "sv": "Svenska", "sw": "Kiswahili", "ta": "தமிழ்", "te": "తెలుగు",
            "tg": "Тоҷикӣ", "th": "ไทย", "ti": "ትግርኛ", "tk": "Türkmen dili", "tl": "Tagalog",
            "tr": "Türkçe", "tt": "Татарча", "ug": "ئۇيغۇرچە", "uk": "Українська", "ur": "اردو",
            "uz": "Oʻzbekcha", "vi": "Tiếng Việt", "xh": "isiXhosa", "yi": "ייִדיש", "yo": "Yorùbá",
            "zh-CN": "简体中文", "zh-TW": "繁體中文", "zu": "isiZulu"
        };

        let map, marker;
        let currentCity = "Bogotá";
        let currentCountry = "Colombia";
        let currentX = 4.6097;
        let currentY = -74.0817;

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                hl: params.get('hl') || 'en',
                q: params.get('q') || '',
                z: parseInt(params.get('z')) || 13,
                x: parseFloat(params.get('x')) || 4.6097,
                y: parseFloat(params.get('y')) || -74.0817,
            };
        }

        function setQueryParam(key, value) {
            const url = new URL(window.location.href);
            url.searchParams.set(key, value);
            window.history.replaceState({}, '', url);
        }

        function populateLanguages(selectedLang) {
            const select = document.getElementById('hostLang');
            select.innerHTML = '';
            for (const [code, name] of Object.entries(hostLanguages)) {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = name;
                opt.classList.add("untranslatable");
                if (code === selectedLang) opt.selected = true;
                select.appendChild(opt);
            }
        }

        async function translatePage(targetLang) {
            if (!targetLang || targetLang === 'en') return;
            const elements = document.querySelectorAll('body *:not(script):not(style):not(.untranslatable):not(#hostLang)');
            
            elements.forEach(async (el) => {
                if (el.children.length === 0 && el.textContent.trim() !== '') {
                    const text = el.textContent.trim();
                    if (/^\d+(\.\d+)?,\s*-\d+(\.\d+)?$/.test(text)) return;
                    try {
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                        const data = await res.json();
                        if (data && data[0] && data[0][0][0]) {
                            el.textContent = data[0][0][0];
                        }
                    } catch (e) {}
                }
            });
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const lang = document.getElementById('hostLang').value || 'en';
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function reverseGeocode(lat, lng) {
            currentX = parseFloat(lat.toFixed(4));
            currentY = parseFloat(lng.toFixed(4));
            document.getElementById('coordsDisplay').textContent = `${currentX}, ${currentY}`;
            
            setQueryParam('x', currentX);
            setQueryParam('y', currentY);

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`);
                const data = await res.json();
                if (data && data.address) {
                    currentCity = data.address.city || data.address.town || data.address.village || data.address.state || "Location";
                    currentCountry = data.address.country || "";
                    const locStr = currentCountry ? `Located on ${currentCity}, ${currentCountry}` : `Located on ${currentCity}`;
                    document.getElementById('locationDisplay').textContent = locStr;
                    
                    const lang = document.getElementById('hostLang').value;
                    if (lang !== 'en') translatePage(lang);
                }
            } catch (e) {
                document.getElementById('locationDisplay').textContent = `Located on ${currentX}, ${currentY}`;
            }
        }

        async function searchLocation(query) {
            if (!query) return;
            setQueryParam('q', query);
            document.title = `${query} - S-Mapex`;

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const first = data[0];
                    const lat = parseFloat(first.lat);
                    const lon = parseFloat(first.lon);
                    
                    map.setView([lat, lon], 14);
                    marker.setLatLng([lat, lon]);
                    reverseGeocode(lat, lon);

                    const params = getQueryParams();
                    if (params.q) {
                        speakText(`Results of ${query}.`);
                    }
                }
            } catch (e) {}
        }

        function initMap() {
            const params = getQueryParams();
            
            map = L.map('map', {
                zoomControl: true
            }).setView([params.x, params.y], params.z);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            marker = L.marker([params.x, params.y]).addTo(map);

            map.on('click', (e) => {
                const { lat, lng } = e.latlng;
                marker.setLatLng([lat, lng]);
                reverseGeocode(lat, lng);
            });

            map.on('zoomend', () => {
                setQueryParam('z', map.getZoom());
            });

            reverseGeocode(params.x, params.y);

            if (params.q) {
                document.getElementById('searchInput').value = params.q;
                document.title = `${params.q} - S-Mapex`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = getQueryParams();
            
            populateLanguages(params.hl);
            initMap();

            if (params.hl !== 'en') {
                translatePage(params.hl);
            }

            document.getElementById('searchBtn').addEventListener('click', () => {
                const q = document.getElementById('searchInput').value.trim();
                searchLocation(q);
            });

            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const q = document.getElementById('searchInput').value.trim();
                    searchLocation(q);
                }
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.title = 'S-Mapex';
                setQueryParam('q', '');
            });

            document.getElementById('speakCoordsBtn').addEventListener('click', () => {
                const text = `Coordinates ${currentX}, ${currentY} located on ${currentCity}, ${currentCountry}.`;
                speakText(text);
            });

            document.getElementById('copyLocationBtn').addEventListener('click', () => {
                const copyText = `${currentX}, ${currentY} (${currentCity}, ${currentCountry})`;
                navigator.clipboard.writeText(copyText).then(() => {
                    const btn = document.getElementById('copyLocationBtn');
                    btn.style.opacity = '0.5';
                    setTimeout(() => btn.style.opacity = '1', 500);
                });
            });

            document.getElementById('hostLang').addEventListener('change', (e) => {
                const lang = e.target.value;
                setQueryParam('hl', lang);
                translatePage(lang);
            });
        });
    </script>
</body>
</html>
