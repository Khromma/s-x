<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="s-mapex-logo-map.png">
    <title>S-Mapex</title>
  <style>
        :root {
            --sxpr: #ff005f;
            --sxib: #4444ff;
            --sxgy: #ffbb00;
            --sxcg: #00ff66;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #000000;
        }

        html, body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 0 12px;
            overflow-x: hidden; 
        }
        
        #map {
          width: 100%;
          height: 100%;
        }

        .search-bar {
            width: 100%;
            max-width: 700px;
            min-height: 48px;
            padding: 0 4px 0 4px;
            margin: 20px auto;
            border: 2px solid #ccc;
            border-radius: 25px;
            box-sizing: border-box;
            cursor: pointer;
            display: flex;
            flex-direction: row;            
            gap: 12px;
            align-items: center;
        }

        .search-text {
            flex: 1;
            font-size: 16px;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            padding: 12px 0;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-break: break-word;
            overflow: hidden;
        }

       .search-btn {
           display: flex;
           align-items: center;
           justify-content: center;
           width: 40px;
           height: 40px;
           background: 
               radial-gradient(circle at top left, var(--sxpr) 0%, transparent 70%),
               radial-gradient(circle at top right, var(--sxib) 0%, transparent 70%),
               radial-gradient(circle at bottom left, var(--sxgy) 0%, transparent 70%),
               radial-gradient(circle at bottom right, var(--sxcg) 0%, transparent 70%) !important;
           border: none;
           border-radius: 50%;
           color: #000000;
           cursor: pointer;
           outline: none;
           transition: all 0.2s ease;
           flex-shrink: 0;
       }

       .search-btn svg {
           width: 24px !important;
           height: 24px !important;
           display: block;
           flex-shrink: 0;
       }

        .search-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .search-btn:active {
            transform: scale(0.96);
        }
      
    .zoom-grid {
      width: 25px;
      height: 50px;
      border-radius: 25px;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

      .zoom-btn {
            background: 
                radial-gradient(circle at top left, var(--sxpr) 0%, transparent 70%),
                radial-gradient(circle at top right, var(--sxib) 0%, transparent 70%),
                radial-gradient(circle at bottom left, var(--sxgy) 0%, transparent 70%),
                radial-gradient(circle at bottom right, var(--sxcg) 0%, transparent 70%) !important;
            border: none;
            border-radius: 50%;
            padding: 0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.15s ease, opacity 0.2s ease;
            color: #ffffff !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            width: 23px;
            height: 23px;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .zoom-btn:active {
            transform: scale(0.96);
        }

        .btn-icon {
          width: 18px !important;
          height: 18px !important;
          display: block;
          flex-shrink: 0;
        }
  </style>
</head>
  <body>
    <div id="map"></div>
    <div class="search-bar">
      <button class="search-btn" id="searchBtn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <textarea class="search-text" id="searchText" rows="1" placeholder="Search a place..."></textarea>
      <button class="search-btn" id="clearBtn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="zoom-grid">
        <button class="zoom-btn" id="inBtn">
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 5V19M5 12H19" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="zoom-btn" id="outBtn">
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M5 12H19" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>
    </div>
  <script>
    const map = L.map('map').setView([4.6097, -74.0817], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
       maxZoom: 19,
       attribution: '&copy; <a href="http://openstreetmap.org">OpenStreetMap</a>'
    }).addTo(map);
  </script>
  </body>
</html>
