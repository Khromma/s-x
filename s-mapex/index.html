<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="s-mapex-logo-map.png">
    <title>S-Mapex</title>
  <style>
        :root {
            --sxpr: #ff005f;
            --sxib: #4444ff;
            --sxgy: #ffbb00;
            --sxcg: #00ff66;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #000000;
        }

        html, body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 0 12px;
            overflow-x: hidden; 
        }
        
        #map {
          width: 100%;
          height: 100%;
        }

    .btns-grid {
      width: 25px;
      height: 50px;
      border-radius: 25px;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
  <body>
    <div id="map"></div>
    <div class="btns-grid"></div>
  <script>
    const map = L.map('map').setView([4.6097, -74.0817], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
       maxZoom: 19,
       attribution: '&copy; <a href="http://openstreetmap.org">OpenStreetMap</a>'
    }).addTo(map);
  </script>
  </body>
</html>
