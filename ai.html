<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        font-family: Arial, sans-serif;
        background: #d9dbd5;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .chat {
        width: 100%;
        max-width: 430px;
        height: 100vh;
        background: #efeae2;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .header {
        height: 60px;
        background: #075e54;
        color: white;
        display: flex;
        align-items: center;
        padding: 0 15px;
        font-size: 18px;
        font-weight: bold;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #25d366;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 12px;
        font-size: 20px;
    }

    .messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .message {
        max-width: 75%;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 15px;
        line-height: 1.4;
        word-wrap: break-word;
    }

    .ai {
        align-self: flex-start;
        background: white;
    }

    .user {
        align-self: flex-end;
        background: #d9fdd3;
    }

    .input-area {
        min-height: 62px;
        background: #f0f2f5;
        padding: 10px;
        display: flex;
        gap: 8px;
    }

    input {
        flex: 1;
        border: none;
        outline: none;
        border-radius: 22px;
        padding: 12px 16px;
        font-size: 16px;
    }

    button {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: #128c7e;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="chat">

    <div class="header">
        <div class="avatar">AI</div>
        Hello & Goodbye AI
    </div>

    <div class="messages" id="messages">
        <div class="message ai">Hello! 👋</div>
    </div>

    <div class="input-area">
        <input id="input" type="text" placeholder="Type a message...">
        <button id="send">➤</button>
    </div>

</div>

<script>
const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");

function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;
    messages.appendChild(userMessage);

    const lower = text.toLowerCase();

    let reply;

    if (/^(hi|hello|hey|greetings)\b/.test(lower)) {
        reply = "Hello! 👋";
    } else if (/\b(goodbye|bye|see you)\b/.test(lower)) {
        reply = "Goodbye! 👋";
    } else {
        reply = "I only understand greetings and goodbyes.";
    }

    setTimeout(() => {
        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai";
        aiMessage.textContent = reply;
        messages.appendChild(aiMessage);
        messages.scrollTop = messages.scrollHeight;
    }, 300);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>

</html>
